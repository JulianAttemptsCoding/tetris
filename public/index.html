<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NES Tetris — Friends</title><link rel="stylesheet" href="style.css?v=2"></head><body>
<main><header><h1>NES TETRIS</h1><p>Local • LAN • friends</p></header><section class="game"><div class="boardWrap"><canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas><div id="gameStatus">PRESS START</div></div><aside><div class="panel"><b>SCORE</b><strong id="score">000000</strong><b>LINES</b><strong id="lines">00</strong></div><div class="panel"><b>NEXT</b><canvas id="next" width="120" height="100"></canvas></div><button type="button" id="start">START</button><button type="button" id="pause" aria-pressed="false" disabled>PAUSE</button><button type="button" id="settings">SETTINGS</button></aside></section>
<section id="settingsPanel" class="settings hidden"><h2>CONTROLS</h2><p>Click a control, then press its new key.</p><div id="bindings"><label>Move left <input data-action="left" readonly></label><label>Move right <input data-action="right" readonly></label><label>Soft drop <input data-action="down" readonly></label><label>Rotate <input data-action="rotate" readonly></label><label>Hard drop <input data-action="hardDrop" readonly></label></div><button id="resetKeys">RESET KEYS</button></section>
<section class="multiplayer"><h2>PLAY WITH FRIENDS</h2><div><input id="name" maxlength="16" placeholder="Your name"><input id="room" maxlength="8" placeholder="Room code" value="TETRIS"><button type="button" id="join">JOIN ROOM</button></div><p id="roomStatus">Solo mode — join a room to show your game to friends.</p><div id="players"></div></section><footer>Open Settings to view or change controls.</footer></main><script src="https://cdn.socket.io/4.8.1/socket.io.min.js" crossorigin="anonymous"></script><script src="game.js?v=2"></script></body></html>
