<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NES Tetris — Friends</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><h1>NES TETRIS</h1><p>Local • LAN • friends</p></header><section class="game"><canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas><aside><div class="panel"><b>SCORE</b><strong id="score">000000</strong><b>LINES</b><strong id="lines">00</strong></div><div class="panel"><b>NEXT</b><canvas id="next" width="120" height="100"></canvas></div><button id="start">START / RESTART</button><button id="pause">PAUSE</button></aside></section>
<section class="multiplayer"><h2>PLAY WITH FRIENDS</h2><div><input id="name" maxlength="16" placeholder="Your name"><input id="room" maxlength="8" placeholder="Room code" value="TETRIS"><button id="join">JOIN ROOM</button></div><p id="roomStatus">Solo mode — join a room to show your game to friends.</p><div id="players"></div></section><footer>Move: ← → &nbsp; Rotate: ↑ / X &nbsp; Soft drop: ↓ &nbsp; Hard drop: Space</footer></main><script src="/socket.io/socket.io.js"></script><script src="game.js"></script></body></html>
